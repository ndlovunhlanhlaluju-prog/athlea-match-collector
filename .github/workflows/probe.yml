name: Test RBTV cloud collection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rbtv-cloud-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Read public schedule in a normal browser
        run: xvfb-run -a npm run probe
      - name: Save public fixture feed and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athlea-cloud-probe
          path: runtime/output/*.json
          retention-days: 3
          if-no-files-found: warn
